name: render-animado
# GERACAO NOVA de reels (Rafael, 18/10/2026): animacao sem rosto comandada pelo tempo das
# palavras — formatos CONVERSA ("Se o seu ___ pudesse responder") e COMO FUNCIONA (mecanismo
# animado). Renderiza UM episodio de episodios_entretenimento.py e commita
# reels/_preview_<id>.mp4 + o irmao .json. NAO mexe em reels.json: a peca so' entra na fila depois que o video
# existe no repo (publicar reel sem mp4 falha ALTO no publish.py).
#   gh workflow run render-animado.yml -f episodio=cv_fixador --repo rafaelvs/06_Automacao_Instagram
on:
  workflow_dispatch:
    inputs:
      episodio:
        description: "ID do episodio em episodios_entretenimento.py (ex.: cv_fixador, cf_alongamento)"
        required: true

permissions:
  contents: write

concurrency:
  group: render-animado-${{ github.event.inputs.episodio }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # a entrada vai por variavel de ambiente e e' validada: interpolar ${{ }} direto no shell
      # deixava um id com aspas/; virar comando (auditoria 19/10)
      EP: ${{ github.event.inputs.episodio }}
    steps:
      - name: Validar o id do episodio
        run: |
          if ! [[ "$EP" =~ ^[a-z0-9_]{3,60}$ ]]; then echo "::error::id de episodio invalido: '$EP'"; exit 1; fi
      - uses: actions/checkout@v4
        id: checkout
      - name: Fontes (Roboto, reserva Liberation/DejaVu) + ffmpeg + libEGL (o skia-python exige no Linux)
        # 19/10/2026: o 1o lote de renders falhou com 'libEGL.so.1: cannot open shared object file'.
        run: sudo apt-get update && sudo apt-get install -y fonts-roboto fonts-liberation fonts-dejavu-core ffmpeg libegl1 libgl1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias (skia-python, edge-tts, numpy; voz F = Gemini-TTS + alinhador faster-whisper)
        run: pip install skia-python edge-tts numpy imageio-ffmpeg requests google-auth faster-whisper
      - name: Cache do modelo do alinhador (faster-whisper small, ~460 MB)
        # 16/11/2026: o Gemini-TTS nao devolve tempo por palavra; o tempo sai do audio (animado/alinhar.py).
        # So' e' usado quando o texto NAO esta' em animado/voz_cache/ (re-render nao chama whisper).
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--Systran--faster-whisper-small
          key: faster-whisper-small-v1
      - name: Credencial do Gemini-TTS (secret GCP_TTS_SA_JSON -> arquivo temporario)
        # Sem o secret o render AINDA funciona para texto que ja' esta' no cache; texto novo falha ALTO
        # em animado/voz.py com a mensagem de credencial faltando (nunca sai video mudo).
        env:
          SA_JSON: ${{ secrets.GCP_TTS_SA_JSON }}
        run: |
          if [ -n "$SA_JSON" ]; then
            umask 077
            printf '%s' "$SA_JSON" > "$RUNNER_TEMP/gcp_tts_sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp_tts_sa.json" >> "$GITHUB_ENV"
          else
            echo "::warning::secret GCP_TTS_SA_JSON ausente: so' texto ja' em animado/voz_cache/ pode ser narrado."
          fi
      - name: Guarda-freio de voz (mudanca de voz exige piloto aprovado — regra 30/08/2026)
        run: python checar_voz.py
      - name: Renderizar (portao do episodio + CFM antes do 1o quadro; texto da tela conferido; irmao .json)
        id: render
        run: python -m animado.render "$EP"
      - name: Commit do mp4 + arquivo-irmao + cache de voz (hash do texto e do motor que geraram o video)
        # ANTES das previas: previa que falha (edge-tts instavel) nao pode perder o video pronto.
        # 16/11/2026 (revisao): o cache de voz vai NO MESMO commit do mp4. Com dois passos, o do cache
        # rodava antes e o `git pull --rebase` dele recusava ("You have unstaged changes": o mp4 e o
        # irmao re-renderizados, ja versionados) — o passo caia e o mp4 nunca era commitado.
        id: commit_mp4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "reels/_preview_${EP}.mp4" "reels/_preview_${EP}.json"
          if [ -d animado/voz_cache ]; then git add animado/voz_cache; fi
          git commit -m "Render animado ${EP} (geracao nova)" || echo "nada a commitar"
          ok=0
          for attempt in 1 2 3 4 5; do
            # -X theirs: num rebase, "theirs" e' o commit deste render. Re-render do mesmo episodio
            # em sequencia dava conflito BINARIO no mp4 e as 5 tentativas falhavam (auditoria 19/10)
            if git pull --rebase --autostash -X theirs origin main && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            echo "Push tentativa $attempt falhou — aguardando ${attempt}0s..."
            sleep $((attempt * 10))
          done
          if [ "$ok" != "1" ]; then
            echo "::error::mp4 renderizado mas NAO commitado apos 5 tentativas — render perdido."
            exit 1
          fi
      - name: Commit so' do cache de voz (o render caiu DEPOIS de a voz ser paga e conferida)
        # o proximo render reaproveita exatamente o mesmo som em vez de sortear outra amostra.
        # --autostash: o mp4/irmao podem ter ficado modificados pelo render que caiu.
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.render.outcome == 'failure' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d animado/voz_cache ]; then git add animado/voz_cache; fi
          if git diff --cached --quiet; then echo "cache de voz sem novidade"; exit 0; fi
          git commit -m "Cache de voz do render animado ${EP} (render falhou depois da voz)"
          ok=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash -X theirs origin main && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            echo "Push do cache tentativa $attempt falhou — aguardando ${attempt}0s..."
            sleep $((attempt * 10))
          done
          if [ "$ok" != "1" ]; then
            echo "::error::cache de voz gerado mas NAO commitado apos 5 tentativas — o proximo render sorteia outra amostra."
            exit 1
          fi
      - name: Quadros de conferencia (reusa o cache de voz do render)
        continue-on-error: true
        run: python -m animado.render "$EP" --previa --tmp ".animado_tmp/$EP"
      - name: Artefato (video + irmao + quadros)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animado-${{ env.EP }}
          path: |
            animado/voz_cache/*
            reels/_preview_${{ env.EP }}.mp4
            reels/_preview_${{ env.EP }}.json
            .animado_tmp/${{ env.EP }}/*.png
          if-no-files-found: warn
