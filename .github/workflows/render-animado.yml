name: render-animado
# GERACAO NOVA de reels (Rafael, 18/10/2026): animacao sem rosto comandada pelo tempo das
# palavras — formatos CONVERSA ("Se o seu ___ pudesse responder") e COMO FUNCIONA (mecanismo
# animado). Renderiza UM episodio de episodios_entretenimento.py e commita
# reels/_preview_<id>.mp4 + o irmao .json. NAO mexe em reels.json: a peca so' entra na fila depois que o video
# existe no repo (publicar reel sem mp4 falha ALTO no publish.py).
#   gh workflow run render-animado.yml -f episodio=cv_fixador --repo rafaelvs/06_Automacao_Instagram
on:
  workflow_dispatch:
    inputs:
      episodio:
        description: "ID do episodio em episodios_entretenimento.py (ex.: cv_fixador, cf_alongamento)"
        required: true

permissions:
  contents: write

concurrency:
  group: render-animado-${{ github.event.inputs.episodio }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # a entrada vai por variavel de ambiente e e' validada: interpolar ${{ }} direto no shell
      # deixava um id com aspas/; virar comando (auditoria 19/10)
      EP: ${{ github.event.inputs.episodio }}
    steps:
      - name: Validar o id do episodio
        run: |
          if ! [[ "$EP" =~ ^[a-z0-9_]{3,60}$ ]]; then echo "::error::id de episodio invalido: '$EP'"; exit 1; fi
      - uses: actions/checkout@v4
      - name: Fontes (Roboto, reserva Liberation/DejaVu) + ffmpeg + libEGL (o skia-python exige no Linux)
        # 19/10/2026: o 1o lote de renders falhou com 'libEGL.so.1: cannot open shared object file'.
        run: sudo apt-get update && sudo apt-get install -y fonts-roboto fonts-liberation fonts-dejavu-core ffmpeg libegl1 libgl1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias (skia-python, edge-tts, numpy)
        run: pip install skia-python edge-tts numpy imageio-ffmpeg
      - name: Guarda-freio de voz (mudanca de voz exige piloto aprovado — regra 30/08/2026)
        run: python checar_voz.py
      - name: Renderizar (portao do episodio + CFM antes do 1o quadro; texto da tela conferido; irmao .json)
        run: python -m animado.render "$EP"
      - name: Commit do mp4 + arquivo-irmao (hash do texto e do motor que geraram o video)
        # ANTES das previas: previa que falha (edge-tts instavel) nao pode perder o video pronto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "reels/_preview_${EP}.mp4" "reels/_preview_${EP}.json"
          git commit -m "Render animado ${EP} (geracao nova)" || echo "nada a commitar"
          ok=0
          for attempt in 1 2 3 4 5; do
            # -X theirs: num rebase, "theirs" e' o commit deste render. Re-render do mesmo episodio
            # em sequencia dava conflito BINARIO no mp4 e as 5 tentativas falhavam (auditoria 19/10)
            if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            echo "Push tentativa $attempt falhou — aguardando ${attempt}0s..."
            sleep $((attempt * 10))
          done
          if [ "$ok" != "1" ]; then
            echo "::error::mp4 renderizado mas NAO commitado apos 5 tentativas — render perdido."
            exit 1
          fi
      - name: Quadros de conferencia (reusa o cache de voz do render)
        continue-on-error: true
        run: python -m animado.render "$EP" --previa --tmp ".animado_tmp/$EP"
      - name: Artefato (video + irmao + quadros)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animado-${{ env.EP }}
          path: |
            reels/_preview_${{ env.EP }}.mp4
            reels/_preview_${{ env.EP }}.json
            .animado_tmp/${{ env.EP }}/*.png
          if-no-files-found: warn
