name: ci-testes
# CI de testes do caminho de publicacao (auditoria v1.5, achado A5: zero teste rodava na
# main — o contrato de exit code do publish.py so era conferido a mao). Offline por
# construcao: os dois testes stubam `requests` em sandbox temporario, nada toca a rede.
on:
  push:
  pull_request:
  # v1.6 (11/09/2026): `on: push` ficou 12 dias com ZERO execucoes — os 38 commits do
  # periodo sao 100% do github-actions[bot], e push feito com GITHUB_TOKEN nao dispara
  # workflow (guarda anti-recursao do GitHub). Num repo cujo unico committer diario e' o
  # robo, `on: push` e' gatilho estruturalmente inalcancavel. O cron diario e' o batimento
  # cardiaco: prova que a suite continua VIVA sem depender de push humano.
  schedule:
    - cron: "40 9 * * *"      # 06:40 BRT, fora de qualquer janela de publicacao
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Contrato de EXIT do publish.py (job vermelho quando item falha)
        run: python teste_publish_exit.py
      - name: Caminho de erro de auth/rate-limit (token morre no meio, 400 OAuthException)
        run: python test_publicacao.py
      - name: "Lint de LEGENDA da fila (A4, 12/09/2026 - sem hashtag, 1 CTA, 1 mencao, assinatura com Medico)"
        # Auto-teste primeiro: detector que nunca reprovou nao vale (5 controles positivos semeados).
        run: |
          python checar_legenda.py --auto-teste
          python checar_legenda.py
      - name: "Auto-teste dos checadores novos (auditoria v2, 19/09/2026)"
        # Checador que nunca reprova nao e' checador: cada um destes tem controle POSITIVO
        # (semeia o defeito e exige acusacao) e NEGATIVO (valor correto tem de passar).
        # O de duracao pegou a si mesmo na primeira execucao: o controle negativo estava
        # contaminado porque `conferir()` relia o disco e descartava a semente.
        run: |
          python checar_dur.py --auto-teste
          python sincronizar_texto_sequencias.py --auto-teste
          python rerender_frame.py --autoteste
      - name: "Duracao real dos reels (dur e' o denominador da retencao)"
        # A auditoria v1 publicou 9,5% de retencao onde o real era 3,5% porque `dur` vinha do
        # storyboard, nao do MP4. 54 de 57 itens erravam >10%; 47 nao tinham dur nenhum.
        run: python checar_dur.py
      - name: "Cobertura do portao CFM (fila viva bloqueia; acervo publicado so reporta)"
        run: python checar_cfm.py
      - name: "Geracao nova (18/10/2026): episodios e fila de formato novo"
        # Episodio mal formado, texto com violacao CFM, peca de formato novo na fila sem video,
        # sem legenda valida, sem declaracao de voz de IA (que liga o rotulo) ou com `scenes`
        # divergente do video = VERMELHO. Auto-teste primeiro: portao que nunca reprova nao vale.
        run: |
          python checar_entretenimento.py --auto-teste
          python checar_entretenimento.py
      - name: "Agenda = robo (auditoria 19/10/2026): a pagina projeta com a MESMA regra do publish"
        # regra_reels.py e' a fonte unica da cota; o teste confere os dias, que o publish usa a regra
        # unica, que o publish.yml nao sobrescreve a cota por variavel e casos calculados a mao.
        run: python publish_agenda.py
      - name: "Guarda de voz (regra do piloto, 30/08/2026): auto-teste + voz vigente = aprovada"
        # Antes so' rodava na hora do render e o auto-teste em lugar nenhum: o controle 3 virou no-op
        # em 18/10 e so' foi notado a mao. Aqui roda no push e no cron diario.
        run: |
          python checar_voz.py --auto-teste
          python checar_voz.py
      - name: "Stories da geracao nova e regra de temas (24/10/2026): auto-testes + fila"
        # Publicador em partes sem duplicar (controles: contêiner em ERROR, prazo, erro da Meta com
        # contêiner PUBLISHED/FINISHED/incerto), portão da story (aprovação por hash, irmão, texto
        # desenhado, CFM) e distância entre temas. A fila real roda por último (aprovação pendente
        # é aviso; qualquer outro problema é vermelho).
        run: |
          python publicar_stories.py
          python temas_conteudo.py
          python checar_stories.py --autoteste
          python checar_stories.py
