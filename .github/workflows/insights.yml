name: Pulso de Insights (leitura)

# Pulso de metricas p/ a auditoria evolutiva — SO LEITURA (GET na Graph API).
# Nao publica, nao altera a conta, nao commita nada. Disparo manual:
#   gh workflow run insights.yml            (janela padrao 30d)
#   gh workflow run insights.yml -f days=7  (janela custom)
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Janela em dias (padrao 30)"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  pulso:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pulso de insights
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PULSE_DAYS: ${{ inputs.days }}
        run: python3 insights_pulse.py
