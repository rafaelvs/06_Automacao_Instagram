name: render-sequences
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Instalar fontes Liberation
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - name: Instalar Pillow
        run: pip install pillow
      - name: Renderizar temporadas (455 frames) + sequences.json
        run: python gerar_temporadas.py
      - name: Commit das imagens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images sequences.json
          git commit -m "Render story sequences (automated)" || echo "nada a commitar"
          git push
