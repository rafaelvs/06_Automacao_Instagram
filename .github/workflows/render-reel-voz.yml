name: render-reel-voz
on:
  workflow_dispatch:
    inputs:
      episodio:
        description: "ID do episódio (andador, pe_chato, dor_crescimento, displasia_quadril, pernas_tortas, ponta_dos_pes, pe_torto, quando_procurar)"
        required: false
        default: "andador"
      vozes:
        description: "Vozes edge-tts a renderizar (separadas por virgula) p/ A/B. Masculinas pt-BR: Antonio, Fabio, Humberto, Julio, Valerio, Donato"
        required: false
        default: "pt-BR-AntonioNeural,pt-BR-FabioNeural,pt-BR-HumbertoNeural"
      rate:
        description: "Ritmo (ex.: -6% mais devagar, +0% padrão, +5% mais rápido)"
        required: false
        default: "-6%"
      pitch:
        description: "Tom (ex.: -2Hz mais grave, +0Hz padrão)"
        required: false
        default: "+0Hz"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar fontes Liberation + ffmpeg
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Pillow + edge-tts (voz neural Microsoft, gratis)
        run: pip install pillow edge-tts
      - name: Renderizar reel-episodio em cada voz (A/B)
        env:
          VOZ_ENGINE: edge
          EDGE_RATE: ${{ github.event.inputs.rate || '-6%' }}
          EDGE_PITCH: ${{ github.event.inputs.pitch || '+0Hz' }}
          VOZES: ${{ github.event.inputs.vozes || 'pt-BR-AntonioNeural,pt-BR-FabioNeural,pt-BR-HumbertoNeural' }}
        run: |
          EP="${{ github.event.inputs.episodio || 'andador' }}"
          IFS=',' read -ra LISTA <<< "$VOZES"
          for V in "${LISTA[@]}"; do
            V=$(echo "$V" | xargs)   # trim
            echo "::group::Renderizando $V"
            EDGE_VOICE="$V" python gerar_reel_voz.py "$EP"
            VZ=$(echo "$V" | sed 's/pt-BR-//; s/Neural//')
            mv "reels/_preview_${EP}.mp4" "reels/_preview_${EP}__${VZ}.mp4"
            echo "::endgroup::"
          done
          ls -la reels/_preview_${EP}__*.mp4
      - name: Artefato (todas as variantes)
        uses: actions/upload-artifact@v4
        with:
          name: ab-vozes-${{ github.event.inputs.episodio || 'andador' }}
          path: reels/_preview_*__*.mp4
          if-no-files-found: error
      - name: Commit dos mp4 (sincroniza p/ revisao)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reels/_preview_*.mp4
          git commit -m "Render A/B de vozes ${{ github.event.inputs.episodio || 'andador' }} (preview)" || echo "nada a commitar"
          git pull --rebase origin main || true
          git push
