name: render-reel-voz
on:
  workflow_dispatch:
    inputs:
      episodio:
        description: "ID do episódio (andador, pe_chato, dor_crescimento, displasia_quadril, pernas_tortas, ponta_dos_pes, pe_torto, quando_procurar)"
        required: false
        default: "andador"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar fontes Liberation + ffmpeg
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Pillow + Piper TTS
        run: pip install pillow "piper-tts==1.2.0"
      - name: Baixar voz (placeholder faber pt-BR; trocar por nossa voz treinada quando pronta)
        run: |
          mkdir -p voices
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium"
          curl -L -o voices/pt_BR-faber-medium.onnx      "$base/pt_BR-faber-medium.onnx"
          curl -L -o voices/pt_BR-faber-medium.onnx.json "$base/pt_BR-faber-medium.onnx.json"
      - name: Renderizar reel-episodio com voz
        run: python gerar_reel_voz.py "${{ github.event.inputs.episodio || 'andador' }}"
      - name: Artefato
        uses: actions/upload-artifact@v4
        with:
          name: pe-no-chao-${{ github.event.inputs.episodio || 'andador' }}
          path: reels/_preview_*.mp4
          if-no-files-found: error
      - name: Commit do mp4 (sincroniza p/ revisao)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reels/_preview_*.mp4
          git commit -m "Render reel-episodio com voz (preview)" || echo "nada a commitar"
          git push
