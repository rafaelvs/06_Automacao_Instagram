name: render-reel-voz
on:
  workflow_dispatch:
    inputs:
      episodio:
        description: "ID do episódio (andador, pe_chato, dor_crescimento, displasia_quadril, pernas_tortas, ponta_dos_pes, pe_torto, quando_procurar)"
        required: false
        default: "andador"
      rate:
        description: "Ritmo do Antonio (ex.: -8% mais devagar/conversacional, +0% padrão)"
        required: false
        default: "-8%"
      pitch:
        description: "Tom (ex.: -4Hz grave/autoridade, -6Hz bem grave, +0Hz padrão)"
        required: false
        default: "-4Hz"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar fontes Liberation + ffmpeg
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Pillow + edge-tts (voz neural Microsoft, gratis)
        run: pip install pillow edge-tts
      - name: Guarda-freio de voz (mudanca de voz exige piloto aprovado — regra 30/08/2026)
        run: python checar_voz.py
      - name: Renderizar reel-episodio (voz Antonio, ritmo afinado)
        env:
          VOZ_ENGINE: edge
          EDGE_VOICE: pt-BR-AntonioNeural
          EDGE_RATE: ${{ github.event.inputs.rate || '-8%' }}
          # Fallback alinhado a voz APROVADA no piloto de 30/08/2026 (-8%/-4Hz). O '+0Hz'
          # antigo contradizia o default do input (-4Hz) e o registro humano do aceite (B6/v1.5).
          EDGE_PITCH: ${{ github.event.inputs.pitch || '-4Hz' }}
        run: python gerar_reel_voz.py "${{ github.event.inputs.episodio || 'andador' }}"
      - name: Artefato
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.event.inputs.episodio || 'andador' }}
          path: reels/_preview_*.mp4
          if-no-files-found: error
      - name: Commit do mp4 (sincroniza p/ revisao)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reels/_preview_*.mp4
          git commit -m "Render reel ${{ github.event.inputs.episodio || 'andador' }} (preview Antonio)" || echo "nada a commitar"
          # retry com falha RUIDOSA — mesmo padrao ok-flag do render-verbetes.yml/publish.yml
          # (auditoria v1.5 M1: o loop antigo engolia falha de push — job verde, artefato perdido).
          ok=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            echo "Push tentativa $attempt falhou — aguardando ${attempt}0s..."
            sleep $((attempt * 10))
          done
          if [ "$ok" != "1" ]; then
            echo "::error::mp4 renderizado mas NAO commitado apos 5 tentativas — render perdido."
            exit 1
          fi
