name: render-reel-narrativo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fontes + ffmpeg
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation ffmpeg
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Pillow
        run: pip install pillow
      - name: Renderizar episódios narrativos (silent) + atualizar reels.json
        run: python publicar_narrativos.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reels/pnc_*.mp4 reels.json
          git commit -m "Reels: formato narrativo Pe no Chao (silent) na fila de publicacao" || echo "nada a commitar"
          git push
