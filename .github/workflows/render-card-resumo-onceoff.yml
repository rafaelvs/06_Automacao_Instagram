name: Render pontual — card-resumo discrepancia (ONE-OFF, remover apos uso)

# Roda gerar_card_resumo_discrepancia.py com as fontes Liberation da producao (nao
# existem localmente) e commita so a imagem gerada. Disparo manual, workflow de USO
# UNICO — apagar este arquivo depois de confirmar o resultado.
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Instalar fontes Liberation
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - name: Instalar Pillow
        run: pip install pillow
      - name: Renderizar o card-resumo
        run: python gerar_card_resumo_discrepancia.py
      - name: Commit da imagem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/c_pnc_perna_curta_crianca_5.jpg
          git commit -m "Card-resumo: faixas em cm de discrepancia (renderizado com fontes de producao)" || echo "nada a commitar"
          git push
