name: Renovar token do Instagram

# Elimina a manutencao manual do IG_ACCESS_TOKEN. Roda toda semana e cada
# renovacao devolve +60 dias, entao o token vive folgado e ainda sobram ~8
# tentativas caso alguma falhe. A Meta exige que o token tenha >=24h de vida e
# NAO esteja expirado - token que passa de 60 dias sem renovar morre de vez.
#
# Se este workflow ficar vermelho, o GitHub manda e-mail para o dono do repo.
# Nao ignore: e' o unico aviso antes de a conta parar de publicar.

on:
  schedule:
    - cron: "17 9 * * 1"     # Seg ~06:17 BRT (minuto quebrado: cron do GitHub atrasa menos fora do :00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-refresh-token
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pynacl
      - name: Renovar o token e regravar o secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: python refresh_token.py
      - name: Registrar a data da renovacao
        run: |
          # `git diff` NAO enxerga arquivo NOVO (untracked). Como state/token_refresh.json
          # nunca existiu no repo, a versao anterior deste passo caia sempre no "Sem
          # mudancas no registro" e NUNCA commitava — e, sem o primeiro commit, o arquivo
          # jamais passava a ser rastreado, entao a falha se repetiria para sempre com o
          # job VERDE (token renovado, rastro perdido). Observado no run 30674071604 de
          # 31/07/2026, a primeira renovacao bem-sucedida do motor.
          # Por isso: `git add` PRIMEIRO, e a comparacao passa a ser contra o INDEX.
          if [ ! -f state/token_refresh.json ]; then
            echo "::error::refresh_token.py terminou OK mas nao deixou state/token_refresh.json."
            exit 1
          fi
          git add state/token_refresh.json
          if ! git diff --cached --quiet -- state/token_refresh.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Renova token do Instagram"
            # Mesmo retry do publish.yml: o robo de publicacao commita 1-2x/dia
            # e pode empurrar entre o nosso commit e o push.
            ok=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "Push tentativa $attempt falhou — aguardando ${attempt}0s..."
              sleep $((attempt * 10))
            done
            # Diferenca proposital em relacao ao publish.yml: la' o estado nao salvo
            # faz REPUBLICAR, entao e' erro. Aqui o token JA' foi renovado com sucesso
            # - perder o registro e' cosmetico. Avisa, mas nao derruba o job.
            if [ "$ok" != "1" ]; then
              echo "::warning::Token renovado, mas o registro em state/token_refresh.json nao foi salvo."
            fi
          else
            echo "Sem mudancas no registro."
          fi
