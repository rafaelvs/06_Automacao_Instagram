name: Publicar no Instagram

on:
  schedule:
    # GitHub usa UTC (BRT = UTC-3). O robo so publica no horario certo; o controle de
    # estado garante 1 post/1 story por dia, mesmo com varios disparos. Adensamos perto
    # das janelas-alvo porque o cron do GitHub e' "melhor esforco" e atrasa.
    - cron: "*/30 * * * *"                  # catch-all (pega atrasos; nada se perde)
    - cron: "30,40,50 21 * * 2,4,6"         # POSTS ~18:30 BRT (Ter/Qui/Sab)
    - cron: "0,15,35,55 22 * * 2,4,6"       # POSTS reforco
    - cron: "20,40 23 * * 2,4,6"            # POSTS reforco
    - cron: "0,15,30,45 15 * * 1,3,5"       # STORIES ~12:00 BRT (Seg/Qua/Sex)
    - cron: "5,25,45 16 * * 1,3,5"          # STORIES reforco
  workflow_dispatch:
    inputs:
      force_id:
        description: "Publicar um post imediatamente (ex.: post01). Deixe vazio para o modo agendado."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Publicar posts pendentes
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FORCE_ID: ${{ github.event.inputs.force_id }}
        run: python publish.py
      - name: Salvar estado (evita repostar)
        run: |
          if ! git diff --quiet -- state/published.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/published.json
            git commit -m "Atualiza estado de publicacao"
            git push
          else
            echo "Sem mudancas no estado."
          fi
