name: Publicar no Instagram

on:
  schedule:
    # GitHub usa UTC (BRT = UTC-3). O robo so publica no horario certo; o controle de
    # estado garante 1 post/1 story por dia, mesmo com varios disparos. Adensamos perto
    # das janelas-alvo porque o cron do GitHub e' "melhor esforco" e atrasa.
    - cron: "*/30 * * * *"                  # catch-all backup (gatilho principal e cron-job.org)
    - cron: "0,10,20,35,50 18 * * 2,4,6"    # POSTS ~15:00 BRT (Ter/Qui/Sab)
    - cron: "5,20,40 19 * * 2,4,6"          # POSTS reforco
    - cron: "0,15,35 14 * * 0"              # CARROSSEL EXTRA ~11:00 BRT (Dom) - 4o/sem, dia-duplo c/ Reel
    - cron: "30,40,50 15 * * *"               # SEQUENCIAS ~12:30 BRT (TODOS os dias) - 5 frames em bloco
    - cron: "0,15,35 16 * * *"                # SEQUENCIAS reforco
    - cron: "0,10,20,35,50 18 * * 0,1,3,5"    # REELS ~15:00 BRT (Seg/Qua/Sex/Dom)
    - cron: "5,20,40 19 * * 0,1,3,5"          # REELS reforco
  workflow_dispatch:
    inputs:
      force_id:
        description: "Publicar um post imediatamente (ex.: post01). Deixe vazio para o modo agendado."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Publicar posts pendentes
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FORCE_ID: ${{ github.event.inputs.force_id }}
          LOCATION_ID: ${{ vars.LOCATION_ID }}
          TRIAL_REELS: ${{ vars.TRIAL_REELS || 'true' }}
          TRIAL_GRADUATION: ${{ vars.TRIAL_GRADUATION || 'SS_PERFORMANCE' }}
        run: python publish.py
      - name: Salvar estado (evita repostar)
        # `always()` e' OBRIGATORIO: desde que o publish.py sai com exit 1 em falha de
        # autenticacao, sem isto este passo seria PULADO justamente quando o token morre
        # no meio da execucao — o item que ja' foi ao ar nao seria commitado e voltaria
        # para a fila, republicando ("Posta 2x", docs/02_RUNBOOK.md). O job continua
        # VERMELHO de qualquer forma, porque quem falhou foi o passo anterior.
        if: always()
        run: |
          # `git add` PRIMEIRO e comparacao contra o INDEX. `git diff --quiet` NAO
          # enxerga arquivo NOVO (untracked): se state/published.json ainda nao
          # estivesse no repo, este passo diria "Sem mudancas" para sempre com o
          # job VERDE — foi exatamente o que aconteceu com state/token_refresh.json
          # no refresh-token.yml (run 30674071604, corrigido em fdd245b). Aqui o
          # arquivo escapou por ACIDENTE, por ja' ser rastreado desde o inicio.
          if [ ! -f state/published.json ]; then
            echo "::error::publish.py nao deixou state/published.json — o item que ja' foi ao ar voltaria para a fila (Posta 2x)."
            exit 1
          fi
          git add state/published.json
          if ! git diff --cached --quiet -- state/published.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Atualiza estado de publicacao"
            # retry git push p/ evitar race condition (mesmo padrao do render-reel-voz.yml).
            # Um push perdido deixa o estado sem salvar e o item VOLTA PARA A FILA — e' o
            # sintoma "Posta 2x" catalogado em docs/02_RUNBOOK.md.
            ok=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "Push tentativa $attempt falhou — aguardando ${attempt}0s..."
              sleep $((attempt * 10))
            done
            if [ "$ok" != "1" ]; then
              echo "::error::Estado NAO salvo apos 5 tentativas — risco de republicar o mesmo item."
              exit 1
            fi
          else
            echo "Sem mudancas no estado."
          fi
